<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GROOT AI Assistant - GROOT</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .chat-container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .chat-card {
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: 0.75rem;
      height: 600px;
      display: flex;
      flex-direction: column;
    }
    
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    
    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 0.75rem;
    }
    
    .message-user {
      align-self: flex-end;
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
    }
    
    .message-assistant {
      align-self: flex-start;
      background: hsl(var(--muted));
      color: hsl(var(--foreground));
    }
    
    .chat-input-area {
      border-top: 1px solid hsl(var(--border));
      padding: 1rem;
    }
    
    .chat-form {
      display: flex;
      gap: 0.5rem;
      align-items: end;
    }
    
    .image-preview {
      margin-bottom: 0.75rem;
      position: relative;
      display: inline-block;
    }
    
    .image-preview img {
      height: 80px;
      width: 80px;
      object-fit: cover;
      border-radius: 0.5rem;
    }
    
    .image-preview button {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: hsl(var(--destructive));
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
    }
    
    .loading-message {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem;
      background: hsl(var(--muted));
      border-radius: 0.75rem;
      max-width: 80%;
    }
  </style>
</head>
<body>
  <nav id="navigation"></nav>
  
  <main class="container">
    <div class="chat-container">
      <div class="mb-8">
        <h1 style="font-size: 2.5rem; font-weight: bold; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.75rem;">
          💬 GROOT AI Assistant
        </h1>
        <p style="color: hsl(var(--muted-foreground));">Your intelligent farming companion with plant image analysis</p>
      </div>

      <div class="chat-card">
        <div class="chat-messages" id="messages">
          <div class="message message-assistant">
            Hello! I'm GROOT, your AI farming assistant. Ask me anything about plants, farming practices, or upload a plant image for identification and health analysis.
          </div>
        </div>

        <div class="chat-input-area">
          <div id="image-preview" class="image-preview" style="display: none;">
            <img id="preview-img" alt="Selected plant">
            <button onclick="clearImage()">×</button>
          </div>
          
          <form class="chat-form" id="chat-form">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <button type="button" class="btn btn-secondary" style="padding: 0.75rem;" onclick="document.getElementById('image-input').click()">
              📷
            </button>
            <input 
              type="text" 
              id="message-input" 
              placeholder="Ask about plants, farming, or upload an image..."
              style="flex: 1;"
            >
            <button type="submit" class="btn btn-primary" style="padding: 0.75rem;" id="send-btn">
              ➤
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="navigation.js"></script>
  <script src="auth-check.js"></script>
  <script>
    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    const sendBtn = document.getElementById('send-btn');
    
    let selectedImage = null;
    
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = () => {
          selectedImage = reader.result;
          previewImg.src = selectedImage;
          imagePreview.style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
      }
    });
    
    function clearImage() {
      selectedImage = null;
      imagePreview.style.display = 'none';
      imageInput.value = '';
    }
    
    function addMessage(content, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message message-${isUser ? 'user' : 'assistant'}`;
      messageDiv.textContent = content;
      messagesContainer.appendChild(messageDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function showLoading() {
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'loading-message';
      loadingDiv.id = 'loading-message';
      loadingDiv.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; border-width: 2px;"></div><span>GROOT is thinking...</span>';
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function hideLoading() {
      const loading = document.getElementById('loading-message');
      if (loading) loading.remove();
    }
    
    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const message = messageInput.value.trim();
      if (!message && !selectedImage) return;
      
      const userMessage = selectedImage 
        ? `[Image uploaded] ${message || 'Analyze this plant'}` 
        : message;
      
      addMessage(userMessage, true);
      messageInput.value = '';
      sendBtn.disabled = true;
      messageInput.disabled = true;
      
      showLoading();
      
      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/groot-chat`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: message || 'Analyze this plant image and provide detailed information.',
            image: selectedImage
          })
        });
        
        const data = await response.json();
        
        if (!response.ok) {
          throw new Error(data.error || 'Failed to get response');
        }
        
        hideLoading();
        addMessage(data.reply);
        clearImage();
      } catch (error) {
        hideLoading();
        addMessage('Sorry, I encountered an error. Please try again.');
        showToast(error.message, 'error');
      } finally {
        sendBtn.disabled = false;
        messageInput.disabled = false;
        messageInput.focus();
      }
    });
  </script>
</body>
</html>
